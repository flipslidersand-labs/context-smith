name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # fmt / clippy / build / test / coverage は qa-workflows の reusable に集約 (#121)。
  # runner は reusable 側で vars.GATE_RUNNER -> ubuntu-latest の順に解決される。
  rust:
    permissions:
      contents: read
      pull-requests: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      coverage-threshold: 75
      # linux-general runner には OpenSSL 開発ヘッダが無い (openssl-sys のビルドに必要)
      system-deps: libssl-dev pkg-config

  # reusable は feature 切替を渡せないため、system SQLite 構成だけローカルに残す
  test-no-default:
    name: test (no-default-features / system SQLite)
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system SQLite / OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev pkg-config

      - name: Test (no-default-features)
        run: cargo test --all --no-default-features

      - name: Build (no-default-features)
        run: cargo build --no-default-features

  # reusable は feature 切替を渡せないため、remote-embed feature のテスト (RemoteEmbedder 等) はここで走らせる (#221)
  test-remote-embed:
    name: test (remote-embed feature)
    permissions:
      contents: read
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Test (remote-embed)
        run: cargo test --features remote-embed

  adapter:
    name: adapter (Claude Code skill)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test adapters/claude-code
        run: CONTEXTSMITH_BIN="$PWD/target/release/contextsmith" bash adapters/claude-code/test.sh

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-rust.yml@main
