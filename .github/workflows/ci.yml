name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Coverage (default features, fail-under 60%)
        run: cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 60

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

      - name: Test (no-default-features / system SQLite)
        run: |
          sudo apt-get install -y libsqlite3-dev
          cargo test --all --no-default-features

      - name: Build (no-default-features / system SQLite)
        run: cargo build --no-default-features
