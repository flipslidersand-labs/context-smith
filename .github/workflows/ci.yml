name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on PR refs only. Pushes to master get a per-sha group
# so every master commit keeps its own CI result (no cancel, no pending-drop).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 既定は最小権限。書き込みが要る job (rust / reviewdog) は job 側で明示する。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # fmt / clippy / build / test / coverage は qa-workflows の reusable に集約 (#121)。
  # runner は reusable 側で vars.GATE_RUNNER -> ubuntu-latest の順に解決される。
  rust:
    permissions:
      contents: read
      pull-requests: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/rust-test.yml@main
    with:
      coverage-threshold: 75
      # pkg-config は libz-sys / libsqlite3-sys (system SQLite) が参照する。OpenSSL は git2 0.21 以降依存に無く不要 (#229)
      system-deps: pkg-config

  # reusable は feature 切替を渡せないため、system SQLite 構成だけローカルに残す
  test-no-default:
    name: test (no-default-features / system SQLite)
    # 公開リポ: repo-compass ADR-010 の標準形 (既定値なし)。変数は ubuntu-latest (GitHub-hosted) で固定
    runs-on: ${{ vars.GATE_RUNNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install system SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Test (no-default-features)
        run: cargo test --all --no-default-features

      - name: Build (no-default-features)
        run: cargo build --no-default-features

  adapter:
    name: adapter (Claude Code skill)
    # 公開リポ: repo-compass ADR-010 の標準形。変数は ubuntu-latest (GitHub-hosted) で固定
    runs-on: ${{ vars.GATE_RUNNER }}
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: cargo build --release

      - name: Test adapters/claude-code
        run: CONTEXTSMITH_BIN="$PWD/target/release/contextsmith" bash adapters/claude-code/test.sh

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-rust.yml@main
