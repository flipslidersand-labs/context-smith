name: No AI Artifacts

# AI ツールの作業副産物(.claude/ 配下、.mcp.json)が追跡されていないかを検査する。
# 共通ジョブは qa-workflows の no-ai-artifacts.yml(SHA 固定)。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  no-ai-artifacts:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/no-ai-artifacts.yml@aa5cecf1f77e1fd48a2ac13443b07574e9c63578
