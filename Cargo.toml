[package]
name = "context-smith"
version = "0.2.0"
edition = "2021"
description = "AI context compiler — extract task-relevant code from Git repos"
license = "MIT"
repository = "https://github.com/flipslidersand/context-smith"
homepage = "https://github.com/flipslidersand/context-smith"
readme = "README.md"
keywords = ["context", "llm", "bm25", "code-search", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["errors/", "docs/", ".claude/"]

[lib]
name = "context_smith"
path = "src/lib.rs"

[[bin]]
name = "contextsmith"
path = "src/main.rs"

[dependencies]
git2         = "0.19"
tree-sitter  = "0.22"
tree-sitter-rust   = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go     = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
rusqlite     = { version = "0.31", features = ["bundled"] }
petgraph     = "0.6"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
anyhow       = "1"
walkdir      = "2"
ureq         = { version = "2", features = ["json"], optional = true }

[features]
# Enable remote embedding-service integration (semantic search + RRF fusion).
# Off by default so the standard build stays lean and works offline (BM25 only).
remote-embed = ["dep:ureq"]

[dev-dependencies]
tempfile = "3"
