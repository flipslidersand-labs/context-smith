[package]
name = "context-smith"
version = "0.1.0"
edition = "2021"
description = "AI context compiler — extract task-relevant code from Git repos"

[[bin]]
name = "contextsmith"
path = "src/main.rs"

[dependencies]
git2         = "0.19"
tree-sitter  = "0.22"
tree-sitter-rust   = "0.21"
tree-sitter-python = "0.21"
tantivy      = "0.21"
petgraph     = "0.6"
rusqlite     = { version = "0.31", features = ["bundled"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
clap         = { version = "4", features = ["derive"] }
anyhow       = "1"
walkdir      = "2"
